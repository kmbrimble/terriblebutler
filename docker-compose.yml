services:
  terrible-butler:
    container_name: terrible-butler
    build: .
    restart: unless-stopped
    # No `ports:` on purpose (CLAUDE.md constraint #8: never expose the Node port raw). The app is
    # reached through the reverse proxy over the shared network below, at terrible-butler:2626.
    # For local development only, publish it on loopback (never on all interfaces):
    #   ports:
    #     - "127.0.0.1:2626:2626"
    networks:
      - proxynet
    environment:
      - PORT=2626
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - PUID=99
      - PGID=100
      # Machine-generated and hex: openssl rand -hex 32 (at least 64 hex characters).
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH}
      # Behind Nginx Proxy Manager, trust ONLY NPM's address on proxynet, so rate limits key on the real
      # visitor (see CLAUDE.md "Client IP and rate limits"): NPM's proxynet IP (give it a fixed one), or its
      # proxynet subnet if that cannot be pinned (which also trusts every other container on proxynet).
      # NPM must restore the visitor from CF-Connecting-IP (real_ip_header, with set_real_ip_from limited
      # to Cloudflare's ranges) for X-Forwarded-For to carry the right address; otherwise it carries a
      # Cloudflare edge. Never trust docker0 (172.17.0.0/16) or a network whose gateway can carry direct
      # client traffic, and never true or *. Unset = trust nothing.
      # e.g. TRUST_PROXY=172.18.0.5 (set in the environment or an .env file; empty = trust nothing)
      - TRUST_PROXY=${TRUST_PROXY:-}
      # The public origin browsers use (Socket.IO checks it): https://butler.kiztigs.com
      - APP_ORIGIN=${APP_ORIGIN:-}
    volumes:
      - ./data:/app/data
      # Must match UPLOADS_DIR (set in the Dockerfile to /app/public/uploads).
      - ./uploads:/app/public/uploads

networks:
  proxynet:
    # The reverse proxy's network, created outside this file (docker network create proxynet).
    external: true
