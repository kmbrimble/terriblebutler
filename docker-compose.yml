version: '3.8'

services:
  terrible-butler:
    container_name: terrible-butler
    build: .
    restart: unless-stopped
    ports:
      - "2626:2626"
    environment:
      - PORT=2626
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
