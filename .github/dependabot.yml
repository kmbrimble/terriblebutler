version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a new release age a week before a version-update PR is raised, so a compromised or
    # withdrawn release is usually caught first. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      server-minor-patch:
        update-types: [minor, patch]
      server-dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    # Cooldown: see the first block.
    cooldown:
      default-days: 7
    groups:
      client-minor-patch:
        update-types: [minor, patch]
      client-dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Cooldown: see the first block.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Cooldown: see the first block.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
