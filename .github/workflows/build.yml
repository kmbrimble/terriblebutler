name: Build and Push Docker Image

# This repository is a READ-ONLY MIRROR of the primary repo on a private forge (Gitea). Never push here directly:
# the mirror force-syncs from the primary and would discard anything that exists only on GitHub.
#
# The test suite, browser tests and scanners run on the primary's CI and gate merges to main there ("CI / gate"), so a
# commit that reaches main has already passed them. GitHub's only job is to publish the container image to GHCR when the
# mirror delivers a push to main. This workflow does NOT commit, push or tag anything (read-only `contents`), so it
# cannot diverge from the primary. workflow_dispatch rebuilds the image from the current main on demand.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/kmbrimble/terriblebutler:latest
