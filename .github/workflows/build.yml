name: Build and Push Docker Image

# `gate` runs on every push to main and to security/** branches, on pull requests, and on demand. Only a
# push to main goes on to `build-and-push`, which `needs` the gate: nothing is published as :latest
# unless the full test suite, the browser tests and the scanners have passed on that exact commit.
on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tool versions and the checksums of the downloaded binaries are pinned here, in one place.
  SEMGREP_VERSION: '1.176.0'
  HADOLINT_VERSION: 'v2.15.1'
  HADOLINT_SHA256: 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507'
  OSV_SCANNER_VERSION: 'v2.5.1'
  OSV_SCANNER_SHA256: 'f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be'

jobs:
  gate:
    name: Tests and scanners
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      # Backend suite (includes ShellCheck over every *.sh) and the client unit suite.
      - name: Tests (server, ShellCheck, client unit)
        run: npm test

      - name: Client type-check and build
        run: npm --prefix client run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Set up Python (for Semgrep)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Semgrep (p/default, any finding fails)
        run: |
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          semgrep --config p/default --metrics=off --error .

      - name: Hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile

      - name: OSV-Scanner (both lockfiles)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -L package-lock.json -L client/package-lock.json

      - name: npm audit (server and client, any severity)
        run: |
          npm audit --audit-level=low
          npm --prefix client audit --audit-level=low

  build-and-push:
    name: Build and push image
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/kmbrimble/terriblebutler:latest
